name: Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # TAMBAHKAN BLOK ENV INI UNTUK MENGATASI ERROR SECRETS DI IF
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find and extract ZIP
        run: |
          set -e

          # Cari file .zip di root repo (nama bebas)
          ZIP_FILE=$(find . -maxdepth 1 -type f \( -iname '*.zip' \) ! -name '.*' | head -1 || true)

          # Kalau tidak ada di root, cari 1 level di dalam (kecuali .git)
          if [ -z "$ZIP_FILE" ]; then
            ZIP_FILE=$(find . -maxdepth 2 -type f \( -iname '*.zip' \) ! -path './.git/*' | head -1 || true)
          fi

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Tidak ada file .zip di repository."
            echo "Upload satu file .zip (project Android) ke root repo."
            ls -la
            exit 1
          fi

          echo "ZIP ditemukan: $ZIP_FILE"

          rm -rf build_src
          mkdir -p build_src
          unzip -q -o "$ZIP_FILE" -d build_src

          # Cari folder project Android (gradlew / settings.gradle*)
          PROJECT_DIR=""
          if [ -f "build_src/gradlew" ] || [ -f "build_src/settings.gradle.kts" ] || [ -f "build_src/settings.gradle" ]; then
            PROJECT_DIR="build_src"
          else
            FOUND=$(find build_src -maxdepth 3 \( -name gradlew -o -name settings.gradle.kts -o -name settings.gradle \) | head -1 || true)
            if [ -n "$FOUND" ]; then
              PROJECT_DIR=$(dirname "$FOUND")
            fi
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Di dalam zip tidak ada project Android (gradlew / settings.gradle)."
            find build_src -maxdepth 4 -type f | head -50
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project di: $PROJECT_DIR"
          ls -la "$PROJECT_DIR" | head -25

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          if [ ! -f gradlew ]; then
            echo "ERROR: gradlew tidak ada di project."
            ls -la
            exit 1
          fi
          chmod +x gradlew

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Decode keystore (optional release)
        # UBAH DARI secrets MENJADI env
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > upload-key.jks
          echo "KEYSTORE_PATH=$PWD/upload-key.jks" >> "$GITHUB_ENV"

      - name: Build release APK (optional)
        # UBAH DARI secrets MENJADI env
        if: ${{ env.KEYSTORE_BASE64 != '' && env.STORE_PASSWORD != '' && env.KEY_PASSWORD != '' }}
        working-directory: ${{ env.PROJECT_DIR }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload release APK
        # UBAH DARI secrets MENJADI env
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/release/*.apk
          if-no-files-found: warn
