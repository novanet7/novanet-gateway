name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android SDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0"

      # Cari folder project Android otomatis (lokasi gradlew), di root maupun subfolder
      - name: Build APK
        run: |
          GRADLEW=$(find . -name gradlew -not -path './.git/*' -print -quit)
          if [ -z "$GRADLEW" ]; then
            echo "::error::gradlew tidak ada di repo ini. Isi repo:"
            ls -la
            exit 1
          fi
          cd "$(dirname "$GRADLEW")"
          echo "Project Android: $(pwd)"
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/fr3velora.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: fr3velora
          path: fr3velora.apk
          if-no-files-found: error
