name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android build-tools
        run: |
          export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Prepare Firebase config
        env:
          GOOGLE_SERVICES_JSON_B64: ${{ secrets.GOOGLE_SERVICES_JSON_B64 }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON_B64" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON_B64" | base64 --decode > app/google-services.json
          fi
          test -f app/google-services.json

      - name: Inject Web Client ID
        run: |
          if [ -z "${GOOGLE_WEB_CLIENT_ID// /}" ]; then
            echo "GOOGLE_WEB_CLIENT_ID kosong, memakai nilai di strings.xml"
            exit 0
          fi
          python3 - <<'PY'
          import os, re
          p = 'app/src/main/res/values/strings.xml'
          s = open(p).read()
          cid = os.environ['GOOGLE_WEB_CLIENT_ID'].strip()
          new, n = re.subn(r'(<string name="google_web_client_id"[^>]*>).*?(</string>)',
                           lambda m: m.group(1) + cid + m.group(2), s)
          assert n == 1, 'google_web_client_id tidak ditemukan di strings.xml'
          open(p, 'w').write(new)
          PY

      # debug.keystore dipakai apa adanya dari repo (root), tanpa diubah/dicek
      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk fr3velora.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: fr3velora
          path: fr3velora.apk
          if-no-files-found: error
          retention-days: 30
          
