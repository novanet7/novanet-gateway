name: Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract pixel-frevelora.zip
        run: |
          set -e
          if [ ! -f "pixel-frevelora.zip" ]; then
            echo "ERROR: pixel-frevelora.zip tidak ditemukan di root repo."
            echo "Upload file pixel-frevelora.zip ke root repository, lalu jalankan workflow lagi."
            exit 1
          fi

          rm -rf build_src
          mkdir -p build_src
          unzip -q -o pixel-frevelora.zip -d build_src

          # Cari folder yang berisi gradlew atau settings.gradle (dukung zip nested)
          PROJECT_DIR=""
          if [ -f "build_src/gradlew" ] || [ -f "build_src/settings.gradle.kts" ] || [ -f "build_src/settings.gradle" ]; then
            PROJECT_DIR="build_src"
          else
            # Cari satu level ke dalam (mis. build_src/pixel-frevelora/)
            FOUND=$(find build_src -maxdepth 2 \( -name gradlew -o -name settings.gradle.kts -o -name settings.gradle \) | head -1 || true)
            if [ -n "$FOUND" ]; then
              PROJECT_DIR=$(dirname "$FOUND")
            fi
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Tidak menemukan project Android di dalam zip."
            echo "Isi zip harus punya gradlew atau settings.gradle(.kts)"
            find build_src -maxdepth 3 -type f | head -40
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project ditemukan di: $PROJECT_DIR"
          ls -la "$PROJECT_DIR" | head -30

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          if [ -f gradlew ]; then
            chmod +x gradlew
          else
            echo "gradlew tidak ada — generate wrapper tidak otomatis. Pastikan zip berisi gradlew."
            exit 1
          fi

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Decode keystore (optional release)
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > upload-key.jks
          echo "KEYSTORE_PATH=$PWD/upload-key.jks" >> "$GITHUB_ENV"

      - name: Build release APK (optional)
        if: ${{ secrets.KEYSTORE_BASE64 != '' && secrets.STORE_PASSWORD != '' && secrets.KEY_PASSWORD != '' }}
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload release APK
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/release/*.apk
          if-no-files-found: warn
          
