name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ekstrak ZIP proyek
        run: for z in *.zip; do unzip -oq "$z"; done
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Terima lisensi Android SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.1
      - run: gradle :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: novanet-debug-apk
          path: app/build/outputs/apk/debug/*.apk
      - name: Terbitkan ke Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/*.apk novanet-debug.apk
          gh release delete latest -y --cleanup-tag || true
          gh release create latest novanet-debug.apk \
            --title "Novanet APK terbaru" \
            --notes "Build otomatis" \
            --target "$GITHUB_SHA" --latest
