name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    env:
      GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # LANGKAH DEBUGGING: Mencari file di seluruh folder
      - name: Debug - Find important files
        run: |
          echo "=== 1. Melihat isi folder root ==="
          ls -la
          echo "=== 2. Mencari file debug.keystore di seluruh folder ==="
          find . -name "debug.keystore" -o -name "*.jks" 2>/dev/null || echo "debug.keystore TIDAK DITEMUKAN"
          echo "=== 3. Mencari file gradlew di seluruh folder ==="
          find . -name "gradlew" 2>/dev/null || echo "gradlew TIDAK DITEMUKAN"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android build-tools
        run: |
          export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      # MEMBUAT ULANG KEYSTORE DARI SECRET
      - name: Restore debug keystore from Secret
        env:
          DEBUG_KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -n "$DEBUG_KEYSTORE_B64" ]; then
            echo "$DEBUG_KEYSTORE_B64" | base64 --decode > debug.keystore
            echo "Berhasil membuat file debug.keystore dari Secret."
          else
            echo "::warning::Secret DEBUG_KEYSTORE_B64 kosong. Build akan menggunakan keystore bawaan Gradle (SHA-1 mungkin berbeda)."
          fi

      # VERIFIKASI (Hanya memberi peringatan jika gagal, tidak menghentikan build)
      - name: Verify fixed signing keystore
        run: |
          if [ -f debug.keystore ]; then
            echo "File debug.keystore ditemukan. Memverifikasi SHA-1..."
            keytool -list -v -keystore debug.keystore -storepass android | grep -F 'SHA1: 14:75:B7:63:64:FD:BE:B5:67:04:B8:CA:88:40:A0:C6:66:B1:CA:55' || echo "::warning::SHA-1 keystore tidak cocok! Build mungkin gagal untuk Firebase/Google Sign-In."
          else
            echo "::warning::debug.keystore tidak ditemukan. Melewati verifikasi."
          fi

      - name: Prepare Firebase config
        env:
          GOOGLE_SERVICES_JSON_B64: ${{ secrets.GOOGLE_SERVICES_JSON_B64 }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON_B64" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON_B64" | base64 --decode > app/google-services.json
          fi
          test -f app/google-services.json
          python3 - <<'PY'
          import json, os
          d = json.load(open('app/google-services.json'))
          names = [c['client_info']['android_client_info']['package_name'] for c in d.get('client', [])]
          assert 'id.fr3velora' in names, names
          print('Firebase project:', d['project_info']['project_id'], '| package verified: id.fr3velora')
          web_ids = [o['client_id'] for c in d.get('client', []) for o in c.get('oauth_client', []) if o.get('client_type') == 3]
          cid = os.environ.get('GOOGLE_WEB_CLIENT_ID', '')
          if not any(o.get('client_type') == 1 for c in d.get('client', []) for o in c.get('oauth_client', [])):
              print('::warning::google-services.json tidak berisi OAuth client Android (SHA-1 belum didaftarkan di Firebase). Login Google berisiko gagal (kode 10).')
          elif web_ids and cid not in web_ids:
              print('::warning::GOOGLE_WEB_CLIENT_ID tidak ada di google-services.json (Web client: %s).' % web_ids)
          PY

      - name: Inject Web Client ID
        run: |
          test -n "$GOOGLE_WEB_CLIENT_ID"
          python3 - <<'PY'
          import os, re
          p = 'app/src/main/res/values/strings.xml'
          s = open(p).read()
          cid = os.environ['GOOGLE_WEB_CLIENT_ID'].strip()
          new, n = re.subn(r'(<string name="google_web_client_id"[^>]*>).*?(</string>)',
                           lambda m: m.group(1) + cid + m.group(2), s)
          assert n == 1, 'google_web_client_id tidak ditemukan di strings.xml'
          open(p, 'w').write(new)
          PY
          grep -c 'apps.googleusercontent.com' app/src/main/res/values/strings.xml

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk fr3velora.apk
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --print-certs fr3velora.apk | grep -i 'SHA-1'

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: fr3velora
          path: fr3velora.apk
          if-no-files-found: error
          retention-days: 30
